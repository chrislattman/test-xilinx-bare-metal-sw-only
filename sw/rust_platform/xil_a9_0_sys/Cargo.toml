[package]
name = "xil-a9-0-sys"
description = "Raw bindings to the ps7_cortexa9_0 standalone BSP"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Exposes DEP_XIL_A9_0_{BSP_DIR,INCLUDE,LIB_DIR,SPECS,GCC,XILFFS} to dependent build scripts,
# and keeps a binary from linking two BSPs
links = "xil_a9_0"

# no_std: no test/bench harness or doctests on the target (keeps `--all-targets` working)
[lib]
test = false
doctest = false
bench = false

[build-dependencies]
xil-bsp-build.workspace = true
